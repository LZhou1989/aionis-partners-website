<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aionis Partners - Coming Soon</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .coming-soon-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .coming-soon-logo {
            background: transparent;
            padding: 0;
            margin-bottom: 3rem;
        }

        .coming-soon-logo img {
            max-width: 450px;
            width: 100%;
            height: auto;
            object-fit: contain;
            background: transparent;
            border: none;
            outline: none;
            display: block;
            box-shadow: none;
            -webkit-background-clip: padding-box;
            background-clip: padding-box;
            filter: none;
            opacity: 1;
        }

        .coming-soon-title {
            font-size: 1.75rem;
            font-weight: 300;
            color: #1a1a1a;
            margin-bottom: 3rem;
            letter-spacing: -0.02em;
        }

        .coming-soon-login {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 0;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .coming-soon-login h3 {
            font-size: 1.125rem;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
        }

        .login-code-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-code-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            background: white;
            color: #1a1a1a;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-weight: 400;
            text-align: center;
            letter-spacing: 0.1em;
        }

        .login-code-input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.1);
        }

        .login-code-input::placeholder {
            color: #999;
            letter-spacing: normal;
        }

        .login-code-submit {
            width: 100%;
            padding: 14px 32px;
            background: #1a1a1a;
            color: white;
            border: 1px solid #1a1a1a;
            border-radius: 0;
            font-size: 0.95rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
        }

        .login-code-submit:hover {
            background: #333;
            transform: translateY(-1px);
        }

        .error-message {
            color: #d32f2f;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .coming-soon-title {
                font-size: 1.5rem;
            }

            .coming-soon-logo img {
                max-width: 350px;
            }

            .coming-soon-login {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="coming-soon-container">
        <div class="coming-soon-logo">
            <img src="Logo3_Transparent2.png" alt="Aionis Partners Logo">
        </div>
        
        <h1 class="coming-soon-title">Coming soon...</h1>
        
        <div class="coming-soon-login">
            <form id="comingSoonLoginForm" class="login-code-form">
                <input 
                    type="text" 
                    id="accessCode" 
                    class="login-code-input" 
                    placeholder="Enter access code" 
                    required
                    autocomplete="off"
                >
                <button type="submit" class="login-code-submit">Access</button>
                <div id="errorMessage" class="error-message">Invalid access code. Please try again.</div>
            </form>
        </div>
    </div>

    <script>
        // Check if user already has access
        if (localStorage.getItem('siteAccessGranted') === 'true') {
            window.location.href = 'index.html';
        }

        // Handle login form submission
        const loginForm = document.getElementById('comingSoonLoginForm');
        const accessCodeInput = document.getElementById('accessCode');
        const errorMessage = document.getElementById('errorMessage');

        // You can change this access code to whatever you want
        const CORRECT_ACCESS_CODE = 'AIONIS2025'; // Change this to your desired access code

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const enteredCode = accessCodeInput.value.trim().toUpperCase();
            
            if (enteredCode === CORRECT_ACCESS_CODE) {
                // Store access granted in localStorage
                localStorage.setItem('siteAccessGranted', 'true');
                
                // Redirect to main page
                window.location.href = 'index.html';
            } else {
                // Show error message
                errorMessage.classList.add('show');
                accessCodeInput.value = '';
                accessCodeInput.focus();
                
                // Hide error after 3 seconds
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        });

        // Clear error message when user starts typing
        accessCodeInput.addEventListener('input', function() {
            if (errorMessage.classList.contains('show')) {
                errorMessage.classList.remove('show');
            }
        });
    </script>
</body>
</html>
